[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "draft-rl"
version = "0.1.0"
description = "DRAFT-RL method implementation with multi-agent CoD, reward modeling, and PPO"
requires-python = ">=3.11"
dependencies = [
  "accelerate==1.10.1",
  "datasets==4.0.0",
  "peft==0.17.1",
  "safetensors>=0.4,<1",
  "torch>=2.8,<3",
  "transformers==4.57.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
